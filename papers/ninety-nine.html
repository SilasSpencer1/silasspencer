<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ninety-Nine DQN — Paper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inconsolata', monospace; background: #FFFBF5; color: #333; }
    .content-box { border: 1px dashed #d1d5db; padding: 2rem; background: #fff; }
    .viewer { border: 1px solid #e5e7eb; background: #fff; border-radius: 8px; min-height: 480px; overflow: hidden; }
    .pdf-link { color: #2563eb; text-decoration: underline; }
  </style>
</head>
<body class="antialiased">
  <div class="container mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-8 md:py-16">
    <div id="header-placeholder"></div>

    <div class="content-box mb-6">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Ninety-Nine DQN — Research Paper</h1>
      <p class="text-gray-600">This page embeds the compiled PDF locally.</p>
      <div id="pdf-note" class="mt-3 text-sm"></div>
    </div>

    <div class="content-box">
      <h2 class="text-xl font-semibold text-gray-900 mb-3">viewer</h2>
      <div id="viewer" class="viewer p-0 overflow-hidden"></div>
    </div>
  </div>

  <script>
    // Load header
    fetch('../header.html').then(r => r.text()).then(html => { document.getElementById('header-placeholder').innerHTML = html; });

    const PDF_PATH = '99_RL_Agent_Final_Paper.pdf';

    function showPdf() {
      const root = document.getElementById('viewer');
      root.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = PDF_PATH;
      iframe.className = 'w-full';
      iframe.style.minHeight = '70vh';
      iframe.setAttribute('title', 'Ninety-Nine DQN (PDF)');
      root.appendChild(iframe);
    }

    fetch(PDF_PATH, { method: 'HEAD' }).then(r => {
      if (r.ok) {
        showPdf();
        const note = document.getElementById('pdf-note');
        if (note) note.innerHTML = `Compiled PDF available: <a class="pdf-link" href="${PDF_PATH}" target="_blank">open PDF</a>`;
      } else {
        document.getElementById('viewer').innerHTML = '<div class="p-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded">PDF not found at papers/99_RL_Agent_Final_Paper.pdf</div>';
      }
    }).catch(() => {
      document.getElementById('viewer').innerHTML = '<div class="p-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded">Unable to load PDF.</div>';
    });
  </script>
</body>
</html>
